# Initializer's own automatic startup loading is disabled here (written into the server's runtime
# properties, read before any module starts) so that MetadataInitializer can explicitly control when
# Initializer's domains load, rather than relying on Initializer's own module startup timing.
property.initializer.startup.load=disabled
property.initializer.row.checksums.enabled=true

db.h2.supported=false
